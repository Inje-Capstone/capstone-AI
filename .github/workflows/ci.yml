name: AI Engine CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 = 팀원 맥 .venv, 3.12 = Docker 이미지
        python-version: ['3.9', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # API 키 없이 mock LLM으로 전량 통과해야 한다.
      - name: Test
        env:
          ROOKIE_LLM_BACKEND: mock
        run: python -m pytest -q

      - name: Lint
        run: python -m ruff check .

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t rookie-ai-engine .
