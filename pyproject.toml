[project]
name = "rookie-ai-engine"
version = "0.1.0"
description = "루키(ROOKIE) AI 엔진 — 중계 이벤트 인지, 상황별 룰 설명 카드 생성, 경기 맥락 챗봇"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI의 Depends()/Query()/Path() 기본값은 프레임워크 관용구다.
"app/api/*.py" = ["B008"]
